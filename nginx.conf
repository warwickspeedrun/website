server {
    listen 80;
    server_name warwickspeed.run;

    root /srv/warwickspeedrun/prod/public;

    absolute_redirect off;

    index index.html;

    include /etc/nginx/redirects.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(images/|fonts/|icon-packs/) {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 81;
    server_name draft.warwickspeed.run;

    root /srv/warwickspeedrun/draft/public;

    absolute_redirect off;

    index index.html;

    include /etc/nginx/redirects.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(images/|fonts/|icon-packs/) {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }
}
